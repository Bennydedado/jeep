<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="40" font-size="26" font-weight="bold" fill="#111" text-anchor="start">3. Nano board wiring</text><rect x="520" y="90" width="300" height="800" rx="10" fill="#eafbea" stroke="#15803d" stroke-width="2"/><text x="670.0" y="116" font-size="24" font-weight="bold" fill="#111" text-anchor="middle">Arduino Nano</text><text x="670.0" y="138" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">on your board</text><circle cx="520" cy="150" r="5" fill="#111"/><text x="530" y="155" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GND</text><circle cx="520" cy="200" r="5" fill="#111"/><text x="530" y="205" font-size="14" font-weight="bold" fill="#111" text-anchor="start">5V</text><circle cx="520" cy="300" r="5" fill="#111"/><text x="530" y="305" font-size="14" font-weight="bold" fill="#111" text-anchor="start">A0</text><circle cx="520" cy="430" r="5" fill="#111"/><text x="530" y="435" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D5</text><circle cx="520" cy="540" r="5" fill="#111"/><text x="530" y="545" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D7</text><circle cx="520" cy="650" r="5" fill="#111"/><text x="530" y="655" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D3</text><circle cx="520" cy="760" r="5" fill="#111"/><text x="530" y="765" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D4</text><circle cx="520" cy="840" r="5" fill="#111"/><text x="530" y="845" font-size="14" font-weight="bold" fill="#111" text-anchor="start">A1</text><circle cx="820" cy="200" r="5" fill="#111"/><text x="810" y="205" font-size="14" font-weight="bold" fill="#111" text-anchor="end">D1 (TX)</text><circle cx="820" cy="300" r="5" fill="#111"/><text x="810" y="305" font-size="14" font-weight="bold" fill="#111" text-anchor="end">D8 (RX)</text><circle cx="820" cy="380" r="5" fill="#111"/><text x="810" y="385" font-size="14" font-weight="bold" fill="#111" text-anchor="end">D9, D10</text><rect x="40" y="110" width="200" height="110" rx="10" fill="#fff4e6" stroke="#ea7a00" stroke-width="2"/><text x="140.0" y="136" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Buck converter</text><text x="140.0" y="158" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">5 V out (same as T3)</text><path d="M240,150 L520,150" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><text x="380" y="142" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">GND</text><path d="M240,200 L520,200" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><text x="380" y="192" font-size="13.5" font-weight="bold" fill="#d62828" text-anchor="middle">+5 V</text><rect x="40" y="250" width="200" height="110" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="140.0" y="276" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Steering wheel</text><text x="140.0" y="298" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">buttons: 1 wire +</text><text x="140.0" y="317" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">return (clockspring)</text><path d="M240,300 L520,300" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="330" y="292" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">button wire → A0</text><path d="M440,300 L440,200" fill="none" stroke="#d62828" stroke-width="2.5" stroke-linejoin="round"/><rect x="431" y="228" width="18" height="44" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="456" y="255" font-size="14" font-weight="bold" fill="#111" text-anchor="start">1 kΩ</text><path d="M240,340 L280,340 L280,355" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/><path d="M266,358 L294,358 M271,364 L289,364 M276,370 L284,370" stroke="#111" stroke-width="2.5"/><text x="300" y="362" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">return to GND</text><text x="60" y="392" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">A0 reads: R-mid 65, L-mid 159, L-top 229,</text><text x="60" y="407" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">L-bottom 429, R-top 576, R-bottom 778, none 1022</text><rect x="40" y="410" width="200" height="70" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="140.0" y="436" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Foot pedal</text><text x="140.0" y="458" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">momentary</text><path d="M240,430 L520,430" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="380" y="422" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">pedal → D5</text><path d="M240,465 L280,465 L280,500" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/><path d="M266,503 L294,503 M271,509 L289,509 M276,515 L284,515" stroke="#111" stroke-width="2.5"/><text x="300" y="470" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">other side to GND</text><rect x="40" y="515" width="200" height="70" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="140.0" y="541" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Stalk wire</text><text x="140.0" y="563" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">L309 wh/or, switch side</text><path d="M240,540 L520,540" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><path d="M366,528 L366,552 L390,540 Z" fill="#fff" stroke="#111" stroke-width="2.5"/><path d="M392,527 L392,553" stroke="#111" stroke-width="5"/><text x="380" y="522" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">1N4148</text><text x="380" y="576" font-size="12.5" font-weight="bold" fill="#111" text-anchor="middle">stripe toward the stalk</text><rect x="40" y="615" width="200" height="80" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="140.0" y="641" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Kenwood stereo</text><text x="140.0" y="663" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">remote / steering</text><text x="140.0" y="682" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">wire (KMM-BT332U)</text><rect x="290" y="612" width="150" height="86" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="365.0" y="638" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">Q1 2N2222</text><text x="365.0" y="660" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">+ base resistor</text><text x="365.0" y="679" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">+ pull-down</text><path d="M440,650 L520,650" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="480" y="642" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">D3</text><path d="M240,655 L300,655" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="365" y="716" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">collector → stereo wire,</text><text x="365" y="731" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">emitter → GND (on your board)</text><rect x="250" y="742" width="190" height="56" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="345.0" y="768" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">K1 relay</text><text x="345.0" y="790" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">on your board</text><path d="M440,760 L520,760" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="480" y="752" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">D4</text><rect x="250" y="815" width="190" height="60" rx="10" fill="#fff" stroke="#111" stroke-width="2"/><text x="345.0" y="841" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Fail-safe relay</text><text x="345.0" y="863" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">module: IN, VCC, GND</text><path d="M440,840 L520,840" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="480" y="832" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A1 → IN</text><text x="60" y="780" font-size="13" font-weight="normal" fill="#444" text-anchor="start">contacts: see</text><text x="60" y="798" font-size="13" font-weight="bold" fill="#111" text-anchor="start">drawing 4</text><rect x="1060" y="160" width="260" height="260" rx="10" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/><text x="1190.0" y="186" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">T3</text><circle cx="1060" cy="200" r="5" fill="#111"/><text x="1070" y="205" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GPIO 39</text><circle cx="1060" cy="300" r="5" fill="#111"/><text x="1070" y="305" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GPIO 25</text><path d="M820,200 L1060,200" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linejoin="round"/><text x="940" y="190" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">→ 10 kΩ → (20 kΩ to GND)</text><path d="M820,300 L1060,300" fill="none" stroke="#7e22ce" stroke-width="3.5" stroke-linejoin="round"/><rect x="918" y="291" width="44" height="18" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="940" y="285" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">1 kΩ</text><text x="940" y="335" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">(drawing 2 has the details)</text><text x="830" y="410" font-size="12.5" font-weight="normal" fill="#444" text-anchor="start">used by AltSoftSerial:</text><text x="830" y="426" font-size="12.5" font-weight="bold" fill="#111" text-anchor="start">keep D9 and D10 free</text><text x="870" y="480.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Notes</text><text x="870" y="500.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="870" y="521.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Everything to screw terminals, ~22 AWG is fine.</text><text x="870" y="541.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• GND: buck, Nano, T3, pedal, wheel return and</text><text x="870" y="562.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   relays all share one ground.</text><text x="870" y="582.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Never connect anything to D0 (RX of the USB):</text><text x="870" y="603.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   uploads over USB need it free.</text><text x="870" y="623.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• D2, D6, D11, D12, D13, A2–A7 are free if you</text><text x="870" y="644.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   want more later.</text></svg>