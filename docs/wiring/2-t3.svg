<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="40" font-size="26" font-weight="bold" fill="#111" text-anchor="start">2. T3 wiring (LilyGo T3 V1.6.1)</text><rect x="560" y="90" width="280" height="720" rx="10" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/><text x="700.0" y="116" font-size="24" font-weight="bold" fill="#111" text-anchor="middle">T3</text><text x="700.0" y="138" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">pins as printed on the header</text><circle cx="560" cy="170" r="5" fill="#111"/><text x="570" y="175" font-size="14" font-weight="bold" fill="#111" text-anchor="start">5V</text><circle cx="560" cy="230" r="5" fill="#111"/><text x="570" y="235" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GND</text><circle cx="560" cy="330" r="5" fill="#111"/><text x="570" y="335" font-size="14" font-weight="bold" fill="#111" text-anchor="start">3V3</text><circle cx="560" cy="430" r="5" fill="#111"/><text x="570" y="435" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GPIO 34</text><circle cx="560" cy="530" r="5" fill="#111"/><text x="570" y="535" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GPIO 4</text><rect x="60" y="140" width="200" height="110" rx="10" fill="#fff4e6" stroke="#ea7a00" stroke-width="2"/><text x="160.0" y="166" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Buck converter</text><text x="160.0" y="188" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">5 V out</text><path d="M260,170 L560,170" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><text x="410" y="162" font-size="13.5" font-weight="bold" fill="#d62828" text-anchor="middle">+5 V</text><path d="M260,230 L560,230" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><text x="410" y="222" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">GND</text><rect x="60" y="290" width="200" height="160" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="160.0" y="316" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">GPS M100 Mini</text><text x="250" y="335" font-size="13" font-weight="bold" fill="#111" text-anchor="end">VCC</text><text x="250" y="385" font-size="13" font-weight="bold" fill="#111" text-anchor="end">GND</text><text x="250" y="435" font-size="13" font-weight="bold" fill="#111" text-anchor="end">TX</text><path d="M260,330 L560,330" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><text x="410" y="322" font-size="13.5" font-weight="bold" fill="#d62828" text-anchor="middle">3V3 (not 5 V!)</text><path d="M260,380 L330,380 L330,230" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><path d="M260,430 L560,430" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><text x="410" y="422" font-size="13.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">GPS TX → 34</text><rect x="60" y="500" width="200" height="140" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="160.0" y="526" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Temp probe</text><text x="250" y="545" font-size="13" font-weight="bold" fill="#d62828" text-anchor="end">red</text><text x="250" y="580" font-size="13" font-weight="bold" fill="#222" text-anchor="end">black</text><text x="250" y="615" font-size="13" font-weight="bold" fill="#b58900" text-anchor="end">yellow</text><path d="M260,540 L300,540 L300,330" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><path d="M260,575 L345,575 L345,230" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><path d="M260,610 L420,610 L420,530 L560,530" fill="none" stroke="#b58900" stroke-width="3.5" stroke-linejoin="round"/><text x="490" y="522" font-size="13.5" font-weight="bold" fill="#b58900" text-anchor="middle">data → GPIO 4</text><path d="M470,530 L470,330" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><rect x="461" y="368" width="18" height="44" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="486" y="395" font-size="14" font-weight="bold" fill="#111" text-anchor="start">4.7 kΩ</text><rect x="1080" y="560" width="240" height="240" rx="10" fill="#eafbea" stroke="#15803d" stroke-width="2"/><text x="1200.0" y="586" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">Nano</text><text x="1200.0" y="608" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">your board</text><circle cx="1080" cy="620" r="5" fill="#111"/><text x="1090" y="625" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D1 (TX)</text><circle cx="1080" cy="760" r="5" fill="#111"/><text x="1090" y="765" font-size="14" font-weight="bold" fill="#111" text-anchor="start">D8</text><circle cx="1080" cy="790" r="5" fill="#111"/><text x="1090" y="795" font-size="14" font-weight="bold" fill="#111" text-anchor="start">GND</text><path d="M1080,620 L1000,620 L1000,650 L840,650" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linejoin="round"/><rect x="918" y="641" width="44" height="18" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="940" y="635" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">10 kΩ</text><path d="M880,650 L880,700" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><rect x="871" y="656" width="18" height="44" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="896" y="683" font-size="14" font-weight="bold" fill="#111" text-anchor="start">20 kΩ</text><path d="M880,700 L880,715" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><path d="M866,718 L894,718 M871,724 L889,724 M876,730 L884,730" stroke="#111" stroke-width="2.5"/><text x="870" y="735" font-size="12.5" font-weight="bold" fill="#111" text-anchor="end">GND</text><path d="M840,760 L1080,760" fill="none" stroke="#7e22ce" stroke-width="3.5" stroke-linejoin="round"/><rect x="958" y="751" width="44" height="18" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="980" y="745" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">1 kΩ</text><path d="M1080,790 L1040,790 L1040,840 L345,840 L345,575" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><text x="680" y="832" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">GND to GND (shared)</text><circle cx="840" cy="650" r="5" fill="#111"/><text x="830" y="655" font-size="14" font-weight="bold" fill="#111" text-anchor="end">GPIO 39</text><circle cx="840" cy="760" r="5" fill="#111"/><text x="830" y="765" font-size="14" font-weight="bold" fill="#111" text-anchor="end">GPIO 25</text><text x="890" y="100.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">What each wire does</text><text x="890" y="120.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="890" y="141.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• 5V / GND: power from the keyed buck.</text><text x="890" y="161.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• GPS on 3V3, its TX to 34; GPS RX not connected.</text><text x="890" y="182.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   Go by the letters beside the GPS pads.</text><text x="890" y="202.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Temp probe on 4, 4.7 kΩ pull-up.</text><text x="890" y="223.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Nano D1 → 10 kΩ → 39, and 39 → 20 kΩ → GND:</text><text x="890" y="243.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   turns the Nano&#x27;s 5 V into 3.3 V (buttons in).</text><text x="890" y="264.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• 25 → 1 kΩ → Nano D8 (NEW): Heep&#x27;s settings out.</text><text x="890" y="284.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   The green LED flickers while it sends: normal.</text><text x="890" y="305.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="890" y="325.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Never use GPIO 12, 16 or 17.</text><text x="890" y="346.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">Keep the LoRa radio pins (5, 18, 19, 23, 26,</text><text x="890" y="366.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">27, 32, 33) and SD pins (2, 13, 14, 15) free.</text></svg>