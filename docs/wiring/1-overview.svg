<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="40" font-size="26" font-weight="bold" fill="#111" text-anchor="start">1. The whole system</text><rect x="40" y="80" width="230" height="80" rx="10" fill="#fff4e6" stroke="#ea7a00" stroke-width="2"/><text x="155.0" y="106" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Keyed 12 V</text><text x="155.0" y="128" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">ignition-switched, fused</text><rect x="40" y="230" width="230" height="80" rx="10" fill="#fff4e6" stroke="#ea7a00" stroke-width="2"/><text x="155.0" y="256" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Buck converter</text><text x="155.0" y="278" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">12 V in, 5 V out</text><path d="M155,160 L155,230" fill="none" stroke="#ea7a00" stroke-width="3.5" stroke-linejoin="round"/><text x="175" y="200" font-size="13.5" font-weight="bold" fill="#ea7a00" text-anchor="start">12 V</text><rect x="470" y="200" width="300" height="150" rx="10" fill="#eaf2ff" stroke="#1d4ed8" stroke-width="2"/><text x="620.0" y="226" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">T3</text><text x="620.0" y="248" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">LilyGo T3 V1.6.1</text><text x="620.0" y="267" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">screen, trip computer,</text><text x="620.0" y="286" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">Wi-Fi + Bluetooth</text><rect x="470" y="520" width="300" height="150" rx="10" fill="#eafbea" stroke="#15803d" stroke-width="2"/><text x="620.0" y="546" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">Nano board</text><text x="620.0" y="568" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">Arduino Nano</text><text x="620.0" y="587" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">wheel, pedal, stereo,</text><text x="620.0" y="606" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">headlights</text><path d="M270,270 L370,270 L370,275 L470,275" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><text x="330" y="262" font-size="13.5" font-weight="bold" fill="#d62828" text-anchor="middle">5 V</text><path d="M370,270 L370,595 L470,595" fill="none" stroke="#d62828" stroke-width="3.5" stroke-linejoin="round"/><text x="350" y="470" font-size="13.5" font-weight="bold" fill="#d62828" text-anchor="end">5 V</text><text x="155" y="345" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">GND to both (and to the Jeep)</text><path d="M590,520 L590,350" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linejoin="round"/><path d="M590,350 l-8,14 l16,0 Z" fill="#15803d"/><text x="582" y="445" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="end">buttons</text><text x="582" y="463" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="end">D1 → GPIO 39</text><path d="M650,350 L650,520" fill="none" stroke="#7e22ce" stroke-width="3.5" stroke-linejoin="round"/><path d="M650,520 l-8,-14 l16,0 Z" fill="#7e22ce"/><text x="660" y="445" font-size="13.5" font-weight="bold" fill="#7e22ce" text-anchor="start">settings</text><text x="660" y="463" font-size="13.5" font-weight="bold" fill="#7e22ce" text-anchor="start">GPIO 25 → D8</text><rect x="950" y="80" width="230" height="70" rx="10" fill="#f4f6fa" stroke="#334" stroke-width="2"/><text x="1065.0" y="106" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">GPS (M100 Mini)</text><text x="1065.0" y="128" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">position, speed, clock</text><rect x="950" y="175" width="230" height="70" rx="10" fill="#f4f6fa" stroke="#334" stroke-width="2"/><text x="1065.0" y="201" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Temp probe</text><text x="1065.0" y="223" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">DS18B20, at the grille</text><path d="M770,230 L860,230 L860,115 L950,115" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><path d="M860,210 L950,210" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/><rect x="950" y="270" width="230" height="70" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="1065.0" y="296" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Vgate iCar Pro</text><text x="1065.0" y="318" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">in the OBD port</text><path d="M770,305 L950,305" fill="none" stroke="#666" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9,7"/><text x="860" y="297" font-size="13.5" font-weight="bold" fill="#666" text-anchor="middle">Bluetooth</text><rect x="950" y="365" width="230" height="80" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="1065.0" y="391" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">iPhone: Heep</text><text x="1065.0" y="413" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">Bluetooth or Wi-Fi</text><path d="M770,335 L860,335 L860,405 L950,405" fill="none" stroke="#666" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9,7"/><text x="868" y="380" font-size="13.5" font-weight="bold" fill="#666" text-anchor="start">Bluetooth / Wi-Fi</text><rect x="1200" y="365" width="175" height="90" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="1287.5" y="391" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Google sheet</text><text x="1287.5" y="413" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">Jeep log: trips,</text><text x="1287.5" y="432" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">fill-ups, service</text><path d="M770,345 L820,345 L820,470 L1290,470 L1290,455" fill="none" stroke="#666" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9,7"/><text x="1000" y="462" font-size="13.5" font-weight="bold" fill="#666" text-anchor="middle">home Wi-Fi / hotspot (trips, settings)</text><rect x="950" y="490" width="300" height="52" rx="10" fill="#f7f7f7" stroke="#556" stroke-width="2"/><text x="1100.0" y="516" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Steering wheel</text><text x="1100" y="534" font-size="12.5" font-weight="normal" fill="#555" text-anchor="middle">6 buttons on 1 wire (A0)</text><path d="M770,595 L860,595 L860,516 L950,516" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><rect x="950" y="552" width="300" height="52" rx="10" fill="#f7f7f7" stroke="#556" stroke-width="2"/><text x="1100.0" y="578" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Foot pedal</text><text x="1100" y="596" font-size="12.5" font-weight="normal" fill="#555" text-anchor="middle">D5</text><path d="M770,595 L860,595 L860,578 L950,578" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><rect x="950" y="614" width="300" height="52" rx="10" fill="#f7f7f7" stroke="#556" stroke-width="2"/><text x="1100.0" y="640" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Headlight stalk</text><text x="1100" y="658" font-size="12.5" font-weight="normal" fill="#555" text-anchor="middle">sensed on D7</text><path d="M770,595 L860,595 L860,640 L950,640" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><rect x="950" y="676" width="300" height="52" rx="10" fill="#f7f7f7" stroke="#556" stroke-width="2"/><text x="1100.0" y="702" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Kenwood stereo</text><text x="1100" y="720" font-size="12.5" font-weight="normal" fill="#555" text-anchor="middle">remote wire (D3)</text><path d="M770,595 L860,595 L860,702 L950,702" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><rect x="950" y="738" width="300" height="52" rx="10" fill="#f7f7f7" stroke="#556" stroke-width="2"/><text x="1100.0" y="764" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">High-beam relays</text><text x="1100" y="782" font-size="12.5" font-weight="normal" fill="#555" text-anchor="middle">K1 (D4) + fail-safe (A1)</text><path d="M770,595 L860,595 L860,764 L950,764" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><text x="40" y="720" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Solid lines are wires; dashed lines are radio (Bluetooth / Wi-Fi).</text><text x="40" y="740" font-size="14" font-weight="normal" fill="#333" text-anchor="start">The Nano never waits for the T3: unplug the T3 and the stereo and headlights keep working.</text><text x="40" y="760" font-size="14" font-weight="normal" fill="#333" text-anchor="start">The two T3–Nano wires are the only connection between the two boards (plus a shared GND).</text></svg>