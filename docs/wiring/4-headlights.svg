<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="40" font-size="26" font-weight="bold" fill="#111" text-anchor="start">4. High beams: K1 + fail-safe relay</text><text x="24" y="72" font-size="15" font-weight="normal" fill="#333" text-anchor="start">The high-beam control wire (L309, white/orange, pin 7 at the multifunction switch) is cut, and the two ends go to the fail-safe relay.</text><rect x="40" y="140" width="230" height="110" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="155.0" y="166" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Stalk / switch</text><text x="155.0" y="188" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">grounds L309 when</text><text x="155.0" y="207" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">you pull for high</text><rect x="1110" y="140" width="250" height="110" rx="10" fill="#f7f7f7" stroke="#334" stroke-width="2"/><text x="1235.0" y="166" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Jeep side of L309</text><text x="1235.0" y="188" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">to the body computer:</text><text x="1235.0" y="207" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">grounded = high beams</text><rect x="520" y="110" width="300" height="280" rx="10" fill="#fff7e6" stroke="#ea7a00" stroke-width="2"/><text x="670.0" y="136" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">Fail-safe relay module</text><text x="670.0" y="158" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">IN ← Nano A1</text><text x="670.0" y="177" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">VCC 5 V, GND</text><circle cx="820" cy="200" r="5" fill="#111"/><text x="810" y="205" font-size="14" font-weight="bold" fill="#111" text-anchor="end">COM</text><circle cx="520" cy="200" r="5" fill="#111"/><text x="530" y="205" font-size="14" font-weight="bold" fill="#111" text-anchor="start">NC</text><circle cx="520" cy="330" r="5" fill="#111"/><text x="530" y="335" font-size="14" font-weight="bold" fill="#111" text-anchor="start">NO</text><path d="M800,200 L560,190" stroke="#111" stroke-width="3"/><text x="680" y="232" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">off: COM–NC</text><path d="M800,206 L560,322" stroke="#999" stroke-width="2" stroke-dasharray="6,5"/><text x="700" y="300" font-size="13" font-weight="bold" fill="#888" text-anchor="middle">on: COM–NO</text><path d="M270,200 L520,200" fill="none" stroke="#ea7a00" stroke-width="3.5" stroke-linejoin="round"/><text x="395" y="192" font-size="13.5" font-weight="bold" fill="#ea7a00" text-anchor="middle">switch side → NC</text><path d="M820,200 L1110,200" fill="none" stroke="#ea7a00" stroke-width="3.5" stroke-linejoin="round"/><text x="965" y="192" font-size="13.5" font-weight="bold" fill="#ea7a00" text-anchor="middle">COM → Jeep side</text><path d="M340,200 L340,470" fill="none" stroke="#ea7a00" stroke-width="3" stroke-linejoin="round"/><path d="M326,534 L354,534 L340,510 Z" fill="#fff" stroke="#111" stroke-width="2.5"/><path d="M325,507 L355,507" stroke="#111" stroke-width="5"/><path d="M340,470 L340,505" fill="none" stroke="#ea7a00" stroke-width="3" stroke-linejoin="round"/><path d="M340,536 L340,600" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/><text x="320" y="515" font-size="13" font-weight="bold" fill="#111" text-anchor="end">1N4148</text><text x="320" y="533" font-size="12.5" font-weight="normal" fill="#444" text-anchor="end">stripe up, toward</text><text x="320" y="549" font-size="12.5" font-weight="normal" fill="#444" text-anchor="end">the stalk wire</text><rect x="240" y="600" width="200" height="60" rx="10" fill="#eafbea" stroke="#15803d" stroke-width="2"/><text x="340.0" y="626" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Nano D7</text><text x="340.0" y="648" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">INPUT_PULLUP</text><rect x="520" y="470" width="300" height="190" rx="10" fill="#fff7e6" stroke="#ea7a00" stroke-width="2"/><text x="670.0" y="496" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">K1 relay (on your board)</text><text x="670.0" y="518" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">coil ← Nano D4</text><text x="670.0" y="537" font-size="13.5" font-weight="normal" fill="#444" text-anchor="middle">contact: COM, NO</text><circle cx="520" cy="560" r="5" fill="#111"/><text x="530" y="565" font-size="14" font-weight="bold" fill="#111" text-anchor="start">NO</text><circle cx="520" cy="620" r="5" fill="#111"/><text x="530" y="625" font-size="14" font-weight="bold" fill="#111" text-anchor="start">COM</text><path d="M520,330 L470,330 L470,560 L520,560" fill="none" stroke="#ea7a00" stroke-width="3.5" stroke-linejoin="round"/><text x="462" y="440" font-size="13.5" font-weight="bold" fill="#ea7a00" text-anchor="end">fail-safe NO</text><text x="462" y="458" font-size="13.5" font-weight="bold" fill="#ea7a00" text-anchor="end">→ K1 NO</text><path d="M520,620 L480,620 L480,700" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/><path d="M466,703 L494,703 M471,709 L489,709 M476,715 L484,715" stroke="#111" stroke-width="2.5"/><text x="495" y="725" font-size="13" font-weight="bold" fill="#111" text-anchor="start">K1 COM → GND</text><text x="870" y="300.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">How it behaves</text><text x="870" y="320.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start"></text><text x="870" y="341.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Nano off, crashed or a wire loose: the fail-safe</text><text x="870" y="361.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   relay drops out, COM–NC: the stalk is wired straight</text><text x="870" y="382.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   through to the Jeep, exactly like stock.</text><text x="870" y="402.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Nano running: fail-safe on, COM–NO: the Jeep side</text><text x="870" y="423.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   only sees K1. K1 closed = high beams, open = low.</text><text x="870" y="443.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   (The wire is level-based, so K1 is held, not pulsed.)</text><text x="870" y="464.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• The stalk still works: D7 sees each pull through the</text><text x="870" y="484.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   diode and the Nano flips the beams.</text><text x="870" y="505.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• Headlight mode: click, click, hold the pedal. Then</text><text x="870" y="525.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   each pedal press flips high / low. Heep can leave</text><text x="870" y="546.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   the left middle wheel button out of it.</text><text x="870" y="566.5" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">• The watchdog resets a frozen Nano within 1 s, which</text><text x="870" y="587.0" font-size="14.5" font-weight="normal" fill="#333" text-anchor="start">   drops the fail-safe relay too.</text><text x="40" y="790" font-size="14" font-weight="normal" fill="#a00" text-anchor="start">Drawn from your v2 notes. Check it against your board before you trust it on the road: with the Nano unplugged,</text><text x="40" y="810" font-size="14" font-weight="normal" fill="#a00" text-anchor="start">the stalk must work exactly like stock.</text></svg>