# Builds and tests the T3. Heep Life is the firmware host.
# Keep firmware/t3.json as the one-time bridge for T3s still checking GitHub.
name: Build the T3
on:
  push:
    paths: ['firmware/T3/**', 'tests/**', '*.js', '*.html', '*.css', '.github/workflows/t3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: t3-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 boards and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # pinned, so a library's new major version can't break the build by surprise (firmware/README.md)
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4" "PubSubClient@2.8" "NimBLE-Arduino@2.5.2" "OneWire@2.3.8"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          # pinned below 1.65: playwright 1.65.0 was published without its playwright-core (Nov 2026)
          npm install --no-save 'playwright@<1.65'
          npx playwright install --with-deps chromium
      - name: Run all repository tests
        run: bash tests/run.sh
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs" --export-binaries --output-dir out firmware/T3 2>&1 | tee build.log
      - name: Fail if firmware build failed
        if: steps.build.outcome != 'success'
        run: exit 1
